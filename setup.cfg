[metadata]
name = noahai
version = attr: noahai.__version__
description = Advanced AI assistant with deep learning capabilities
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/BhekumusaEric/NoahAI
author = Bhekumusa Eric Ntshwenya
author_email = bhekumusaeric@gmail.com
license = MIT
license_file = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
python_requires = >=3.8
install_requires =
    tensorflow>=2.8.0
    numpy>=1.19.5
    nltk>=3.6.0
    scikit-learn>=1.0.0
    matplotlib>=3.4.0
    pandas>=1.3.0

[options.packages.find]
exclude =
    tests
    docs

[options.extras_require]
dev =
    pytest>=6.0.0
    pytest-cov>=2.12.0
    black>=21.5b2
    isort>=5.9.1
    flake8>=3.9.2
    mypy>=0.812
    sphinx>=4.0.2
    sphinx_rtd_theme>=0.5.2
    myst-parser>=0.15.1
    twine>=3.4.1
    build>=0.7.0

[flake8]
max-line-length = 127
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist,venv
ignore = E203, W503

[isort]
profile = black
multi_line_output = 3

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
