name: Code Quality

on:
  push:
    branches: [ main, wtc_python_quiz ]
  pull_request:
    branches: [ main, wtc_python_quiz ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 pylint mypy bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Check formatting with black
      run: |
        black --check --diff .
    
    - name: Check imports with isort
      run: |
        isort --check --diff .
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Analyze with pylint
      run: |
        pylint --disable=all --enable=unused-import,unused-variable,unused-argument,redefined-outer-name,undefined-variable --exit-zero src models
    
    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports --install-types --non-interactive src models
    
    - name: Security check with bandit
      run: |
        bandit -r src models -x tests -s B101

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v3
      
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v3
